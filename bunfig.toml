[fmt]
# Matches the style the code already had: no semicolons, single quotes, long lines.
printWidth = 120
semi = false
singleQuote = true

[lint]

[lint.rules]
"eqeqeq" = ["error", "smart"]
# Hook and test callbacks keep their full signature; prefix an unused one with _.
"@typescript-eslint/no-unused-vars" = ["warn", { argsIgnorePattern = "^_" }]
